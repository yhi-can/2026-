<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>塔吉特觀光工廠夢想派對 POS 收銀系統</title>
    <style>
        :root {
            --primary-bg: #1c1d22;
            --card-bg: #282a36;
            --accent-orange: #ff9f43;
            --accent-purple: #9b59b6;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --accent-red: #e74c3c;
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: var(--primary-bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        /* 頂部標題與工具列 */
        header {
            background: linear-gradient(135deg, #4a154b, #2b082e);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            color: #f39c12;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .report-btn {
            background: #8e44ad;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .report-btn:active {
            transform: scale(0.96);
        }

        /* 主區域佈局 */
        .main-container {
            display: flex;
            flex: 1;
            gap: 10px;
            height: calc(100vh - 70px);
        }

        /* 左側：商品按鈕面板 */
        .pos-keys {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .category-group {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .category-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cat-cake { color: #f1c40f; border-color: #f1c40f; }
        .cat-drink { color: #3498db; border-color: #3498db; }
        .cat-jelly { color: #2ecc71; border-color: #2ecc71; }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key-btn {
            background: #343746;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .key-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .key-btn .qty {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .key-btn .price {
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
        }

        /* 個別產品顏色主題 */
        .btn-cake { border-color: #f1c40f; }
        .btn-cake .qty { color: #f39c12; }

        .btn-drink { border-color: #3498db; }
        .btn-drink .qty { color: #3498db; }

        .btn-jelly { border-color: #2ecc71; }
        .btn-jelly .qty { color: #2ecc71; }

        /* 右側：購物車與結帳區 */
        .cart-panel {
            flex: 2;
            background: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .cart-header {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #3d4153;
            display: flex;
            justify-content: space-between;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #343746;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
        }

        .cart-item-title {
            font-size: 15px;
            font-weight: bold;
        }

        .cart-item-price {
            font-size: 13px;
            color: var(--text-muted);
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .del-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* 結帳計算區 */
        .checkout-section {
            background: #1e2029;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .total-row {
            font-size: 22px;
            font-weight: bold;
            color: #f1c40f;
            border-bottom: 1px dashed #3d4153;
            padding-bottom: 6px;
        }

        .paid-input {
            width: 110px;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            padding: 4px 8px;
            background: #282a36;
            border: 1px solid #4f546c;
            color: white;
            border-radius: 6px;
        }

        .change-row {
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 8px;
            margin-top: 5px;
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .pay-btn {
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
        }

        .pay-btn:active, .clear-btn:active {
            transform: scale(0.98);
        }

        /* 報表 Modal 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d4153;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--accent-orange);
        }

        .close-modal {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .stat-card {
            background: #1e2029;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-val {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        .stat-lbl {
            font-size: 12px;
            color: var(--text-muted);
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .report-table th, .report-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #3d4153;
        }

        .report-table th {
            color: var(--accent-orange);
        }

        .reset-day-btn {
            width: 100%;
            background: #c0392b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 針對手機直向螢幕調整 */
        @media (max-width: 600px) {
            body { padding: 5px; height: 100vh; }
            .main-container { flex-direction: column; overflow-y: auto; height: auto; }
            .pos-keys { flex: none; }
            .cart-panel { flex: none; min-height: 380px; }
            .key-grid { grid-template-columns: repeat(3, 1fr); }
            .key-btn { padding: 12px 2px; }
            .key-btn .qty { font-size: 16px; }
            .key-btn .price { font-size: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎃 塔吉特夢想派對 POS</h1>
        <button class="report-btn" onclick="openReport()">📊 當日統計報表</button>
    </header>

    <div class="main-container">
        <!-- 左側：快速按鍵 -->
        <div class="pos-keys">
            <!-- 千層蛋糕 -->
            <div class="category-group">
                <div class="category-title cat-cake">
                    <span>🍰 千層蛋糕</span>
                    <small>組合優惠</small>
                </div>
                <div class="key-grid">
                    <button class="key-btn btn-cake" onclick="addToCart('千層蛋糕 (2片)', 150)">
                        <span class="qty">2片</span>
                        <span class="price">$150</span>
                    </button>
                    <button class="key-btn btn-cake" onclick="addToCart('千層蛋糕 (4片)', 290)">
                        <span class="qty">4片</span>
                        <span class="price">$290</span>
                    </button>
                    <button class="key-btn btn-cake" onclick="addToCart('千層蛋糕 (6片)', 420)">
                        <span class="qty">6片</span>
                        <span class="price">$420</span>
                    </button>
                </div>
            </div>

            <!-- 人氣吸凍飲 -->
            <div class="category-group">
                <div class="category-title cat-drink">
                    <span>🧃 人氣吸凍飲</span>
                    <small>組合優惠</small>
                </div>
                <div class="key-grid">
                    <button class="key-btn btn-drink" onclick="addToCart('吸凍飲 (3杯)', 110)">
                        <span class="qty">3杯</span>
                        <span class="price">$110</span>
                    </button>
                    <button class="key-btn btn-drink" onclick="addToCart('吸凍飲 (6杯)', 200)" style="grid-column: span 2;">
                        <span class="qty">6杯</span>
                        <span class="price">$200</span>
                    </button>
                </div>
            </div>

            <!-- Q彈果汁蒟蒻 -->
            <div class="category-group">
                <div class="category-title cat-jelly">
                    <span>🍇 Q彈果汁蒟蒻</span>
                    <small>組合優惠</small>
                </div>
                <div class="key-grid">
                    <button class="key-btn btn-jelly" onclick="addToCart('果汁蒟蒻 (2包)', 120)">
                        <span class="qty">2包</span>
                        <span class="price">$120</span>
                    </button>
                    <button class="key-btn btn-jelly" onclick="addToCart('果汁蒟蒻 (4包)', 200)">
                        <span class="qty">4包</span>
                        <span class="price">$200</span>
                    </button>
                    <button class="key-btn btn-jelly" onclick="addToCart('果汁蒟蒻 (6包)', 250)">
                        <span class="qty">6包</span>
                        <span class="price">$250</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側：購物車與結帳 -->
        <div class="cart-panel">
            <div class="cart-header">
                <span>🛒 購物車明細</span>
                <span id="item-count">0 項</span>
            </div>

            <div class="cart-items" id="cart-items">
                <!-- 購物車項目透過 JS 動態產生 -->
            </div>

            <div class="checkout-section">
                <div class="row total-row">
                    <span>總金額</span>
                    <span>$<span id="total-amount">0</span></span>
                </div>
                <div class="row">
                    <span>收取現金</span>
                    <input type="number" id="paid-amount" class="paid-input" placeholder="0" oninput="calculateChange()">
                </div>
                <div class="row change-row">
                    <span>找零</span>
                    <span>$<span id="change-amount">0</span></span>
                </div>
                <div class="action-btns">
                    <button class="clear-btn" onclick="clearCart()">清空</button>
                    <button class="pay-btn" onclick="completeCheckout()">結帳</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 當日銷售統計彈窗 -->
    <div class="modal-overlay" id="report-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 當日銷售統計報表</h2>
                <button class="close-modal" onclick="closeReport()">✕</button>
            </div>
            
            <div class="stat-card">
                <div>
                    <div class="stat-val" id="daily-total-revenue">$0</div>
                    <div class="stat-lbl">今日總收入</div>
                </div>
                <div>
                    <div class="stat-val" style="color: #3498db;" id="daily-total-orders">0</div>
                    <div class="stat-lbl">成交筆數</div>
                </div>
            </div>

            <table class="report-table">
                <thead>
                    <tr>
                        <th>品項規格</th>
                        <th>銷售銷量</th>
                        <th>銷售小計</th>
                    </tr>
                </thead>
                <tbody id="report-list">
                    <!-- 動態產生 -->
                </tbody>
            </table>

            <button class="reset-day-btn" onclick="resetDailyData()">⚠️ 清空當日統計資料 (開店重置)</button>
        </div>
    </div>

    <script>
        // 購物車與銷售紀錄狀態
        let cart = [];
        let salesData = JSON.parse(localStorage.getItem('pos_sales_data')) || {
            totalRevenue: 0,
            totalOrders: 0,
            items: {}
        };

        // 加入購物車
        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
        }

        // 更新購物車畫面
        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';
            
            let total = 0;
            let totalQty = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                totalQty += item.qty;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <span class="cart-item-title">${item.name}</span>
                        <span class="cart-item-price">$${item.price} × ${item.qty} = $${itemTotal}</span>
                    </div>
                    <div class="cart-item-actions">
                        <button class="del-btn" onclick="removeItem(${index})">✕</button>
                    </div>
                `;
                cartItemsContainer.appendChild(div);
            });

            document.getElementById('total-amount').innerText = total;
            document.getElementById('item-count').innerText = `${totalQty} 項`;
            calculateChange();
        }

        // 移除單一品項
        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // 清空購物車
        function clearCart() {
            cart = [];
            document.getElementById('paid-amount').value = '';
            updateCartUI();
        }

        // 計算找零
        function calculateChange() {
            const total = parseInt(document.getElementById('total-amount').innerText) || 0;
            const paid = parseInt(document.getElementById('paid-amount').value) || 0;
            const change = paid - total;
            
            const changeEl = document.getElementById('change-amount');
            if (change >= 0) {
                changeEl.innerText = change;
                changeEl.style.color = '#2ecc71';
            } else {
                changeEl.innerText = '0';
                changeEl.style.color = '#e74c3c';
            }
        }

        // 完成結帳
        function completeCheckout() {
            const total = parseInt(document.getElementById('total-amount').innerText) || 0;
            const paid = parseInt(document.getElementById('paid-amount').value) || 0;

            if (cart.length === 0) {
                alert('購物車是空的！');
                return;
            }

            if (paid < total) {
                if (!confirm(`收取金額 ($${paid}) 小於總金額 ($${total})，確定要完成結帳嗎？`)) {
                    return;
                }
            }

            // 累加銷售數據
            salesData.totalRevenue += total;
            salesData.totalOrders += 1;

            cart.forEach(item => {
                if (!salesData.items[item.name]) {
                    salesData.items[item.name] = { qty: 0, revenue: 0 };
                }
                salesData.items[item.name].qty += item.qty;
                salesData.items[item.name].revenue += (item.price * item.qty);
            });

            // 儲存至 LocalStorage
            localStorage.setItem('pos_sales_data', JSON.stringify(salesData));

            alert(`✅ 結帳成功！\n總金額：$${total}\n找零：$${paid >= total ? paid - total : 0}`);

            // 重置購物車
            clearCart();
        }

        // 開啟當日報表
        function openReport() {
            document.getElementById('daily-total-revenue').innerText = `$${salesData.totalRevenue}`;
            document.getElementById('daily-total-orders').innerText = salesData.totalOrders;

            const tbody = document.getElementById('report-list');
            tbody.innerHTML = '';

            const itemKeys = Object.keys(salesData.items);
            if (itemKeys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">今日尚未有銷售紀錄</td></tr>';
            } else {
                itemKeys.forEach(key => {
                    const item = salesData.items[key];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${key}</td>
                        <td>${item.qty} 組/份</td>
                        <td>$${item.revenue}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('report-modal').style.display = 'flex';
        }

        // 關閉當日報表
        function closeReport() {
            document.getElementById('report-modal').style.display = 'none';
        }

        // 重置當日數據
        function resetDailyData() {
            if (confirm('確定要清空今日的所有銷售統計紀錄嗎？此動作無法復原。')) {
                salesData = { totalRevenue: 0, totalOrders: 0, items: {} };
                localStorage.removeItem('pos_sales_data');
                openReport();
            }
        }
    </script>
</body>
</html>
